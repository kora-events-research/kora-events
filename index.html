<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كرة الأحداث — منصة بحثية مفتوحة لتحليل مباريات كرة القدم</title>
<meta name="description" content="نموذج بحثي مفتوح المصدر يتنبأ بأحداث المباريات (أهداف، بطاقات، ركنيات) ويوثّق دقته بشفافية. ليس خدمة مراهنات. Open-source football match-event research, not a betting service.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <button id="lang-toggle" type="button" aria-label="Language">English</button>
  <h1 id="t-title">كرة الأحداث</h1>
  <p class="tagline" id="t-tagline"></p>
  <div id="freshness" class="freshness"></div>
</header>

<main>
<section class="notice" id="t-disclaimer"></section>

<section>
  <h2 id="t-h-fixtures"></h2>
  <p class="hint" id="t-hint-fixtures"></p>
  <div id="fixtures"></div>
  <div id="fixtures-demo"></div>
</section>

<section>
  <h2 id="t-h-events"></h2>
  <p class="hint" id="t-hint-events"></p>
  <div id="events" class="cards"></div>
</section>

<section>
  <h2 id="t-h-metrics"></h2>
  <p class="hint" id="t-hint-metrics"></p>
  <div id="metrics"></div>
  <div id="verdict" class="notice small"></div>
</section>

<section>
  <h2 id="t-h-repro"></h2>
  <p class="hint" id="t-hint-repro"></p>
</section>

<section>
  <h2 id="t-h-limits"></h2>
  <ul class="limits" id="limits-list"></ul>
</section>
</main>

<footer><p id="t-footer"></p></footer>

<script src="assets/app.js"></script>
</body>
</html>
